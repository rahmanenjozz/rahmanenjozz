name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dark
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rahmanenjozz
          filename: github-metrics-dark.svg
          template: classic
          base: repositories
          plugin_traffic: yes
          extras_css: |
            svg, .field { color: #9198a1 !important; }
            h1, h2, h2 a, a { color: #f0f6fc !important; }
            svg.icon, .field svg, h2 svg { fill: #9198a1 !important; }

      - name: Light
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rahmanenjozz
          filename: github-metrics-light.svg
          template: classic
          base: repositories
          plugin_traffic: yes
          extras_css: |
            svg, .field { color: #59636e !important; }
            h1, h2, h2 a, a { color: #1f2328 !important; }
            svg.icon, .field svg, h2 svg { fill: #59636e !important; }
