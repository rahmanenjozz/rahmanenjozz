name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # tiap hari jam 07:00 WIB
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rahmanenjozz
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_traffic: yes
